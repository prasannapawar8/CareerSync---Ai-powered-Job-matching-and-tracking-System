<!DOCTYPE html>
<html>
<head>
  <meta charset="UTF-8">
  <title>CareerSync Web Clipper</title>
  <style>
    body {
      width: 320px;
      margin: 0;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
      background-color: #f7f7f5;
      color: #1c1c1a;
    }
    .container {
      padding: 16px;
    }
    .header {
      display: flex;
      align-items: center;
      gap: 8px;
      font-weight: 600;
      margin-bottom: 16px;
      border-bottom: 1px solid #deded8;
      padding-bottom: 12px;
    }
    .logo {
      width: 24px;
      height: 24px;
      background-color: #1c1c1a;
      color: white;
      border-radius: 6px;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 14px;
    }
    .form-group {
      margin-bottom: 12px;
    }
    label {
      display: block;
      font-size: 12px;
      font-weight: 500;
      margin-bottom: 4px;
      color: #6b6b66;
    }
    input[type="text"], input[type="url"], textarea {
      width: 100%;
      box-sizing: border-box;
      padding: 8px;
      border: 1px solid #deded8;
      border-radius: 6px;
      font-size: 13px;
      outline: none;
    }
    input:focus, textarea:focus {
      border-color: #1c1c1a;
    }
    button {
      width: 100%;
      padding: 10px;
      background-color: #1c1c1a;
      color: white;
      border: none;
      border-radius: 6px;
      font-weight: 500;
      cursor: pointer;
      margin-top: 8px;
    }
    button:hover {
      opacity: 0.85;
    }
    button:disabled {
      opacity: 0.5;
      cursor: not-allowed;
    }
    .hidden {
      display: none;
    }
    .error {
      color: #ae3131;
      font-size: 12px;
      margin-top: 8px;
    }
    .success {
      color: #1f6b45;
      font-size: 12px;
      margin-top: 8px;
      text-align: center;
      font-weight: 500;
    }
  </style>
</head>
<body>
  <div class="container">
    <div class="header">
      <div class="logo">C</div>
      <span>CareerSync</span>
    </div>

    <!-- SETTINGS VIEW -->
    <div id="settings-view" class="hidden">
      <p style="font-size: 13px; margin-bottom: 16px;">Please enter your API token to connect your CareerSync account.</p>
      <div class="form-group">
        <label>API Token</label>
        <input type="text" id="api-token" placeholder="Paste token here...">
      </div>
      <button id="save-settings-btn">Save Token</button>
      <div id="settings-msg"></div>
    </div>

    <!-- CLIP VIEW -->
    <div id="clip-view" class="hidden">
      <div class="form-group">
        <label>Job Title</label>
        <input type="text" id="job-title" placeholder="e.g. Software Engineer">
      </div>
      <div class="form-group">
        <label>Company</label>
        <input type="text" id="job-company" placeholder="e.g. Google">
      </div>
      <div class="form-group">
        <label>Apply URL</label>
        <input type="url" id="job-url" readonly style="background-color: #f1f1ee;">
      </div>
      <button id="clip-btn">Save to Board</button>
      <div id="clip-msg"></div>
      <button id="clear-token-btn" style="background: transparent; color: #6b6b66; border: 1px solid #deded8; margin-top: 12px;">Disconnect Account</button>
    </div>
  </div>

  <script src="popup.js"></script>
</body>
</html>
